<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#aa3bff"/>
  <g transform="translate(50 50) rotate(45)">
    <defs>
      <clipPath id="capsule">
        <rect x="-32" y="-14" width="64" height="28" rx="14"/>
      </clipPath>
    </defs>
    <g clip-path="url(#capsule)">
      <rect x="-32" y="-14" width="32" height="28" fill="#f0e6ff"/>
      <rect x="0" y="-14" width="32" height="28" fill="#ffffff"/>
    </g>
    <rect x="-32" y="-14" width="64" height="28" rx="14" fill="none" stroke="#7e14ff" stroke-width="3"/>
  </g>
</svg>
